<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Family Ancestor Tool — Human Context AI</title>
<link rel="stylesheet" href="/shared.css" />
</head>
<body>
<main>
  <nav class="topbar">
    <h1 style="margin:0">Family Ancestor Tool</h1>
    <a href="/index.html">← Public figures</a>
  </nav>
  <p class="tagline">
    Private to you. No one else can see or edit your family's data — ever.
  </p>
  <div id="app"></div>
</main>

<script src="/shared.js"></script>
<script>
const app = document.getElementById("app");
let token = localStorage.getItem("hca_token") || null;

async function api(path, options = {}) {
  const headers = Object.assign({}, options.headers, token ? { Authorization: `Bearer ${token}` } : {});
  if (options.body) headers["Content-Type"] = "application/json";
  const resp = await fetch(path, Object.assign({}, options, { headers }));
  if (resp.status === 401) {
    logout();
    throw new Error("Session expired. Please log in again.");
  }
  const body = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(body.detail || `Request failed (${resp.status})`);
  return body;
}

function logout() {
  token = null;
  localStorage.removeItem("hca_token");
  renderAuth();
}

// ---------- Auth screen ----------
function renderAuth() {
  app.innerHTML = `
    <section class="card">
      <h2>Log in</h2>
      <form id="login-form">
        <div class="field" style="flex:1">
          <label>Email</label>
          <input type="email" id="login-email" required autocomplete="email" />
        </div>
      </form>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" form="login-form" required autocomplete="current-password" />
      </div>
      <button id="login-btn" type="submit" form="login-form">Log in</button>
      <p class="error" id="login-error" style="display:none"></p>
    </section>
    <section class="card">
      <h2>Or create an account</h2>
      <form id="signup-form">
        <div class="field" style="flex:1">
          <label>Email</label>
          <input type="email" id="signup-email" required autocomplete="email" />
        </div>
      </form>
      <div class="field">
        <label>Password (min 8 characters)</label>
        <input type="password" id="signup-password" form="signup-form" required minlength="8" autocomplete="new-password" />
      </div>
      <button id="signup-btn" type="submit" form="signup-form">Sign up</button>
      <p class="error" id="signup-error" style="display:none"></p>
    </section>`;

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("login-error");
    errEl.style.display = "none";
    try {
      const body = await api("/api/auth/login", {
        method: "POST",
        body: JSON.stringify({
          email: document.getElementById("login-email").value,
          password: document.getElementById("login-password").value,
        }),
      });
      token = body.access_token;
      localStorage.setItem("hca_token", token);
      renderFamilies();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = "block";
    }
  });

  document.getElementById("signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("signup-error");
    errEl.style.display = "none";
    try {
      const body = await api("/api/auth/signup", {
        method: "POST",
        body: JSON.stringify({
          email: document.getElementById("signup-email").value,
          password: document.getElementById("signup-password").value,
        }),
      });
      token = body.access_token;
      localStorage.setItem("hca_token", token);
      renderFamilies();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = "block";
    }
  });
}

// ---------- Families screen ----------
async function renderFamilies() {
  app.innerHTML = `<p class="status">Loading your families…</p>`;
  let families;
  try {
    families = await api("/api/families");
  } catch (err) {
    app.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
    return;
  }

  app.innerHTML = `
    <nav class="topbar">
      <span></span>
      <a href="#" id="logout-link">Log out</a>
    </nav>
    <section class="card">
      <h2>Your Families</h2>
      <p class="note" style="margin-bottom:1rem">
        A Family is one container for your whole family tree. Create ONE
        (e.g. "The Mothukuri Family"), then add each person — Rama Krishna,
        Renuka, Jyothi, Reddiah, ... — as a separate person *inside* it via
        "Add Someone" on the next screen, not as separate families here.
      </p>
      ${families.length ? families.map(f => `
        <div class="list-item" data-id="${f.id}" data-name="${escapeHtml(f.name)}">
          <span>${escapeHtml(f.name)}</span>
          <span class="item-actions">
            <a href="#" class="rename-link" data-id="${f.id}" data-name="${escapeHtml(f.name)}">Rename</a>
            <a href="#" class="delete-link" data-id="${f.id}" data-name="${escapeHtml(f.name)}">Delete</a>
            <span class="muted-inline">${new Date(f.created_at).toLocaleDateString()}</span>
          </span>
        </div>`).join("") : `<p class="note">No families yet — add one below.</p>`}
    </section>
    <section class="card">
      <h2>Add a Family</h2>
      <form id="family-form">
        <input type="text" id="family-name" placeholder="e.g. The Mothukuri Family" required />
        <button type="submit">Create</button>
      </form>
      <p class="error" id="family-error" style="display:none"></p>
    </section>`;

  document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); logout(); });

  app.querySelectorAll(".list-item").forEach(el => {
    el.addEventListener("click", () => renderAncestors(Number(el.dataset.id), el.dataset.name));
  });

  app.querySelectorAll(".rename-link").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const newName = prompt("Rename family to:", el.dataset.name);
      if (!newName || newName === el.dataset.name) return;
      try {
        await api(`/api/families/${el.dataset.id}`, { method: "PATCH", body: JSON.stringify({ name: newName }) });
        renderFamilies();
      } catch (err) {
        alert(err.message);
      }
    });
  });

  app.querySelectorAll(".delete-link").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!confirm(`Delete "${el.dataset.name}" and everyone in it? This can't be undone.`)) return;
      try {
        await api(`/api/families/${el.dataset.id}`, { method: "DELETE" });
        renderFamilies();
      } catch (err) {
        alert(err.message);
      }
    });
  });

  document.getElementById("family-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("family-error");
    errEl.style.display = "none";
    try {
      await api("/api/families", {
        method: "POST",
        body: JSON.stringify({ name: document.getElementById("family-name").value }),
      });
      renderFamilies();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = "block";
    }
  });
}

// ---------- Ancestors screen ----------
async function renderAncestors(familyId, familyName, editingId) {
  app.innerHTML = `<p class="status">Loading ${escapeHtml(familyName)}…</p>`;
  let ancestors;
  try {
    ancestors = await api(`/api/families/${familyId}/ancestors`);
  } catch (err) {
    app.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
    return;
  }

  const editing = editingId ? ancestors.find(a => a.id === editingId) : null;
  const linkableOthers = ancestors.filter(a => a.id !== editingId);

  const optionsFor = (selectedId) => linkableOthers.map(a =>
    `<option value="${a.id}" ${selectedId === a.id ? "selected" : ""}>${escapeHtml(a.name)} (${escapeHtml(a.relation)})</option>`
  ).join("");

  app.innerHTML = `
    <nav class="topbar">
      <a href="#" id="back-link">← All families</a>
      <a href="#" id="logout-link">Log out</a>
    </nav>
    <section class="card">
      <div class="stage-header" style="margin-bottom:1rem">
        <h2 style="margin:0">${escapeHtml(familyName)}</h2>
        <span class="item-actions">
          <a href="#" id="tree-link">View as Tree</a>
          <a href="#" id="rename-family-link">Rename this family</a>
        </span>
      </div>
      ${ancestors.length ? ancestors.map(a => `
        <div class="list-item" data-id="${a.id}" data-name="${escapeHtml(a.name)}">
          <span>${escapeHtml(a.name)} <span class="pill">${escapeHtml(a.relation)}</span></span>
          <span class="item-actions">
            <a href="#" class="edit-ancestor-link" data-id="${a.id}">Edit</a>
            <a href="#" class="delete-ancestor-link" data-id="${a.id}" data-name="${escapeHtml(a.name)}">Delete</a>
            <span class="muted-inline">${a.has_profile ? "Profile ready" : "Not yet explained"}</span>
          </span>
        </div>`).join("") : `<p class="note">No one added yet — add someone below.</p>`}
    </section>
    <section class="card">
      <h2>${editing ? `Edit ${escapeHtml(editing.name)}` : "Add Someone"}</h2>
      <form id="ancestor-form">
        <div class="field">
          <label>Name</label>
          <input type="text" id="a-name" value="${editing ? escapeHtml(editing.name) : ""}" required />
        </div>
        <div class="field">
          <label>Relation to you (e.g. Grandfather, Great-grandmother)</label>
          <input type="text" id="a-relation" value="${editing ? escapeHtml(editing.relation) : ""}" required />
        </div>
        <div class="field">
          <label>Parent in this tree (optional — pick who their mother or father is, if already added)</label>
          <select id="a-parent">
            <option value="">— none / not sure —</option>
            ${optionsFor(editing ? editing.parent_ancestor_id : null)}
          </select>
        </div>
        <div class="field">
          <label>Spouse in this tree (optional — pick their husband or wife if already added, so they sit beside them, not below)</label>
          <select id="a-spouse">
            <option value="">— none / not sure —</option>
            ${optionsFor(editing ? editing.spouse_ancestor_id : null)}
          </select>
        </div>
        <div class="field">
          <label>Born (year, place — optional)</label>
          <input type="text" id="a-birth-year" placeholder="Year" value="${editing && editing.birth_year ? escapeHtml(editing.birth_year) : ""}" style="margin-bottom:0.5rem" />
          <input type="text" id="a-birth-place" placeholder="Place" value="${editing && editing.birth_place ? escapeHtml(editing.birth_place) : ""}" />
        </div>
        <div class="field">
          <label>Died (year, place — optional, leave blank if living)</label>
          <input type="text" id="a-death-year" placeholder="Year" value="${editing && editing.death_year ? escapeHtml(editing.death_year) : ""}" style="margin-bottom:0.5rem" />
          <input type="text" id="a-death-place" placeholder="Place" value="${editing && editing.death_place ? escapeHtml(editing.death_place) : ""}" />
        </div>
        <div class="field">
          <label>What do you remember about them? Write as much as you know — specific decisions, stories, what they were like. The more detail, the better this works.</label>
          <textarea id="a-notes" rows="8" required>${editing ? escapeHtml(editing.notes) : ""}</textarea>
        </div>
        <button type="submit">${editing ? "Save changes" : "Add"}</button>
        ${editing ? `<button type="button" class="secondary" id="cancel-edit-btn">Cancel</button>` : ""}
      </form>
      <p class="error" id="ancestor-error" style="display:none"></p>
    </section>`;

  document.getElementById("back-link").addEventListener("click", (e) => { e.preventDefault(); renderFamilies(); });
  document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); logout(); });

  document.getElementById("tree-link").addEventListener("click", (e) => {
    e.preventDefault();
    renderTree(familyId, familyName, ancestors);
  });

  document.getElementById("rename-family-link").addEventListener("click", async (e) => {
    e.preventDefault();
    const newName = prompt("Rename family to:", familyName);
    if (!newName || newName === familyName) return;
    try {
      await api(`/api/families/${familyId}`, { method: "PATCH", body: JSON.stringify({ name: newName }) });
      renderAncestors(familyId, newName);
    } catch (err) {
      alert(err.message);
    }
  });

  app.querySelectorAll(".list-item").forEach(el => {
    el.addEventListener("click", () => renderAncestorProfile(familyId, familyName, Number(el.dataset.id), el.dataset.name));
  });

  app.querySelectorAll(".edit-ancestor-link").forEach(el => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      renderAncestors(familyId, familyName, Number(el.dataset.id));
    });
  });

  const cancelBtn = document.getElementById("cancel-edit-btn");
  if (cancelBtn) {
    cancelBtn.addEventListener("click", () => renderAncestors(familyId, familyName));
  }

  app.querySelectorAll(".delete-ancestor-link").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!confirm(`Delete "${el.dataset.name}"? This can't be undone.`)) return;
      try {
        await api(`/api/families/${familyId}/ancestors/${el.dataset.id}`, { method: "DELETE" });
        renderAncestors(familyId, familyName);
      } catch (err) {
        alert(err.message);
      }
    });
  });

  document.getElementById("ancestor-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("ancestor-error");
    errEl.style.display = "none";
    const payload = {
      name: document.getElementById("a-name").value,
      relation: document.getElementById("a-relation").value,
      birth_year: document.getElementById("a-birth-year").value || null,
      birth_place: document.getElementById("a-birth-place").value || null,
      death_year: document.getElementById("a-death-year").value || null,
      death_place: document.getElementById("a-death-place").value || null,
      notes: document.getElementById("a-notes").value,
      parent_ancestor_id: document.getElementById("a-parent").value ? Number(document.getElementById("a-parent").value) : null,
      spouse_ancestor_id: document.getElementById("a-spouse").value ? Number(document.getElementById("a-spouse").value) : null,
    };
    try {
      if (editing) {
        await api(`/api/families/${familyId}/ancestors/${editing.id}`, { method: "PATCH", body: JSON.stringify(payload) });
      } else {
        await api(`/api/families/${familyId}/ancestors`, { method: "POST", body: JSON.stringify(payload) });
      }
      renderAncestors(familyId, familyName);
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = "block";
    }
  });
}

// ---------- Tree screen ----------
function renderTree(familyId, familyName, ancestors) {
  const byId = {};
  ancestors.forEach(a => { byId[a.id] = a; });

  const generations = {};
  ancestors.forEach(a => {
    (generations[a.generation] = generations[a.generation] || []).push(a);
  });
  const genKeys = Object.keys(generations).map(Number).sort((x, y) => y - x); // oldest (highest) first

  const rowsHtml = genKeys.map(g => {
    const label = g > 0 ? `${g} generation${g > 1 ? "s" : ""} above you`
      : g < 0 ? `${-g} generation${-g > 1 ? "s" : ""} below you`
      : "Your generation";
    return `
      <div class="tree-row">
        <div class="tree-row-label">${escapeHtml(label)}</div>
        <div class="tree-row-nodes">
          ${generations[g].map(a => `
            <div class="tree-node" data-id="${a.id}" data-name="${escapeHtml(a.name)}">
              <strong>${escapeHtml(a.name)}</strong>
              <div class="muted-inline">${escapeHtml(a.relation)}</div>
              ${a.parent_ancestor_id && byId[a.parent_ancestor_id]
                ? `<div class="tree-parent-caption">↑ child of ${escapeHtml(byId[a.parent_ancestor_id].name)}</div>`
                : ""}
              ${a.spouse_ancestor_id && byId[a.spouse_ancestor_id]
                ? `<div class="tree-parent-caption">⚭ spouse of ${escapeHtml(byId[a.spouse_ancestor_id].name)}</div>`
                : ""}
            </div>`).join("")}
        </div>
      </div>`;
  }).join("");

  app.innerHTML = `
    <nav class="topbar">
      <a href="#" id="back-link">← ${escapeHtml(familyName)}</a>
      <a href="#" id="logout-link">Log out</a>
    </nav>
    <section class="card">
      <h2>${escapeHtml(familyName)} — Family Tree</h2>
      <p class="note">Oldest generation at top, youngest at bottom. Generation is set automatically from "Parent in this tree" links, or guessed from the relation word when that's not set. Click anyone to see their full profile.</p>
      ${rowsHtml}
    </section>`;

  document.getElementById("back-link").addEventListener("click", (e) => { e.preventDefault(); renderAncestors(familyId, familyName); });
  document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); logout(); });
  app.querySelectorAll(".tree-node").forEach(el => {
    el.addEventListener("click", () => renderAncestorProfile(familyId, familyName, Number(el.dataset.id), el.dataset.name));
  });
}

// ---------- Ancestor profile screen ----------
async function renderAncestorProfile(familyId, familyName, ancestorId, ancestorName) {
  app.innerHTML = `
    <nav class="topbar">
      <a href="#" id="back-link">← ${escapeHtml(familyName)}</a>
      <a href="#" id="logout-link">Log out</a>
    </nav>
    <p class="status">Putting together what we know about ${escapeHtml(ancestorName)}… this can take up to a minute.</p>
    <div id="profile-results"></div>`;

  document.getElementById("back-link").addEventListener("click", (e) => { e.preventDefault(); renderAncestors(familyId, familyName); });
  document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); logout(); });

  const resultsEl = document.getElementById("profile-results");
  try {
    const profile = await api(`/api/families/${familyId}/ancestors/${ancestorId}/profile`);
    document.querySelector("main > p.status")?.remove();
    renderProfile(profile, resultsEl);
  } catch (err) {
    document.querySelector("main > p.status")?.remove();
    resultsEl.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
  }
}

// ---------- Boot ----------
if (token) {
  renderFamilies();
} else {
  renderAuth();
}
</script>
</body>
</html>
