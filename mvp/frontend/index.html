<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Human Context AI — MVP</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf9;
    --fg: #1c1c1a;
    --muted: #6b6b64;
    --card: #ffffff;
    --border: #e3e2dd;
    --accent: #7a5cff;
    --chart-surface: #fcfcfb;
    --series-1: #2a78d6; /* blue */
    --series-2: #eb6834; /* orange */
    --series-3: #1baf7a; /* aqua */
    --series-4: #eda100; /* yellow */
    --series-5: #e87ba4; /* magenta */
    --series-6: #008300; /* green */
    --series-7: #4a3aa7; /* violet */
    --series-8: #e34948; /* red */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --fg: #eceae4;
      --muted: #9a988f;
      --card: #1f1f24;
      --border: #33333a;
      --chart-surface: #1a1a19;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #008300;
      --series-7: #9085e9;
      --series-8: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.55;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 3rem 1.25rem 6rem;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 0.25rem;
  }
  .tagline {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 2rem;
    font-size: 0.95rem;
  }
  form {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 2.5rem;
  }
  input[type="text"] {
    flex: 1;
    padding: 0.7rem 0.9rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--fg);
    font-size: 1rem;
  }
  button {
    padding: 0.7rem 1.2rem;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  section.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.4rem;
    margin-bottom: 1.25rem;
  }
  section.card h2 {
    margin-top: 0;
    font-size: 1.05rem;
  }
  .claim { margin-bottom: 0.9rem; }
  .claim:last-child { margin-bottom: 0; }
  .claim p { margin: 0.15rem 0; }
  .badge {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 600;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    margin-right: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    vertical-align: middle;
  }
  .meter-row { margin-bottom: 1rem; }
  .meter-row:last-child { margin-bottom: 0; }
  .meter-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.9rem;
    margin-bottom: 0.3rem;
  }
  .meter-label strong { font-weight: 600; }
  .meter-score { color: var(--muted); font-variant-numeric: tabular-nums; }
  .meter-track {
    height: 8px;
    border-radius: 4px;
    background: var(--border);
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    border-radius: 4px;
    background: var(--accent);
  }
  .meter-justification {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0.35rem 0 0;
  }
  .stage-card {
    border-left: 3px solid var(--accent);
    padding: 0.9rem 0 0.9rem 1rem;
    margin-bottom: 1.1rem;
  }
  .stage-card:last-child { margin-bottom: 0; }
  .stage-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 0.2rem;
  }
  .stage-header strong { font-size: 1rem; }
  .stage-date { color: var(--muted); font-size: 0.85rem; }
  .stage-decision { margin: 0.2rem 0 0.4rem; }
  .stage-pattern {
    font-style: italic;
    color: var(--muted);
    margin: 0 0 0.7rem;
  }
  .stage-meters { display: grid; gap: 0.6rem; }
  .stage-meter-row { display: flex; align-items: center; gap: 0.6rem; }
  .stage-meter-name { flex: 0 0 auto; font-size: 0.8rem; width: 40%; }
  .stage-meter-track {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    overflow: hidden;
  }
  .stage-meter-fill { height: 100%; border-radius: 3px; background: var(--accent); }
  .stage-meter-score { font-size: 0.78rem; color: var(--muted); width: 2.2rem; text-align: right; }
  .decision-block {
    margin-bottom: 1.1rem;
    padding-bottom: 1.1rem;
    border-bottom: 1px dashed var(--border);
  }
  .decision-block:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .decision-title { font-weight: 600; margin: 0 0 0.15rem; }
  .decision-situation {
    font-size: 0.85rem;
    color: var(--muted);
    font-style: italic;
    margin: 0 0 0.6rem;
  }
  .style-row {
    display: grid;
    grid-template-columns: 7.5rem 1fr;
    gap: 0.6rem;
    font-size: 0.88rem;
    margin-bottom: 0.4rem;
  }
  .style-row .style-label {
    color: var(--muted);
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    padding-top: 0.1rem;
  }
  .thinking-pattern-box {
    background: rgba(122, 92, 255, 0.1);
    border-left: 3px solid var(--accent);
    padding: 0.6rem 0.8rem;
    border-radius: 6px;
    margin: 0.6rem 0;
    font-size: 0.93rem;
  }
  .traj-wrap { position: relative; }
  .traj-svg { width: 100%; height: auto; display: block; overflow: visible; }
  .traj-gridline { stroke: var(--border); stroke-width: 1; }
  .traj-axis-label { fill: var(--muted); font-size: 10px; }
  .traj-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .traj-dot { stroke: var(--card); stroke-width: 2; }
  .traj-crosshair { stroke: var(--muted); stroke-width: 1; pointer-events: none; opacity: 0; }
  .traj-hit { fill: transparent; }
  .traj-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.9rem;
    margin-top: 0.75rem;
    font-size: 0.82rem;
  }
  .traj-legend-item { display: flex; align-items: center; gap: 0.4rem; color: var(--fg); }
  .traj-legend-key { width: 16px; height: 2px; border-radius: 1px; flex: none; }
  .traj-tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.7rem;
    font-size: 0.8rem;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.14);
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 5;
    width: 17rem;
  }
  .traj-tooltip-date { color: var(--muted); font-size: 0.72rem; margin-bottom: 0.4rem; }
  .traj-tooltip-block {
    padding-bottom: 0.5rem;
    margin-bottom: 0.5rem;
    border-bottom: 1px dashed var(--border);
  }
  .traj-tooltip-block:last-child { padding-bottom: 0; margin-bottom: 0; border-bottom: none; }
  .traj-tooltip-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.3rem; }
  .traj-tooltip-key { width: 10px; height: 2px; flex: none; border-radius: 1px; }
  .traj-tooltip-score { font-weight: 600; font-variant-numeric: tabular-nums; }
  .traj-tooltip-name { color: var(--muted); }
  .traj-tooltip .claim { margin-bottom: 0.3rem; font-size: 0.78rem; }
  .traj-tooltip .claim:last-child { margin-bottom: 0; }
  .traj-table-toggle {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 0.8rem;
    cursor: pointer;
    padding: 0;
    margin-top: 0.6rem;
  }
  .traj-table { width: 100%; border-collapse: collapse; margin-top: 0.6rem; font-size: 0.8rem; display: none; }
  .traj-table th, .traj-table td {
    border: 1px solid var(--border);
    padding: 0.3rem 0.5rem;
    text-align: center;
  }
  .traj-table th:first-child, .traj-table td:first-child { text-align: left; }
  .lvl-1 { background: #d7f2df; color: #146c2e; }
  .lvl-2 { background: #d9e8ff; color: #1a4fa0; }
  .lvl-3 { background: #fdecc8; color: #8a5a00; }
  .lvl-4 { background: #ece6ff; color: #5b3fb8; }
  @media (prefers-color-scheme: dark) {
    .lvl-1 { background: #123a20; color: #7ee0a0; }
    .lvl-2 { background: #12233f; color: #8bb6ff; }
    .lvl-3 { background: #3a2c0d; color: #f0c264; }
    .lvl-4 { background: #241c40; color: #bfa8ff; }
  }
  .note {
    font-size: 0.85rem;
    color: var(--muted);
    font-style: italic;
  }
  .source-links a {
    font-size: 0.8rem;
    color: var(--accent);
    text-decoration: none;
    margin-right: 0.6rem;
  }
  .timeline-item { display: flex; gap: 0.9rem; margin-bottom: 1rem; }
  .timeline-date {
    flex: 0 0 5.5rem;
    color: var(--muted);
    font-size: 0.85rem;
    padding-top: 0.15rem;
  }
  .status { color: var(--muted); }
  .error { color: #c0392b; }
  .meta-line { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
</style>
</head>
<body>
<main>
  <h1>Human Context AI</h1>
  <p class="tagline">Search a historical or public figure. Not "what happened" — why it happened.</p>

  <form id="search-form">
    <input id="search-input" type="text" placeholder="e.g. Nikola Tesla" autocomplete="off" />
    <button type="submit" id="search-btn">Explain</button>
  </form>

  <div id="results"></div>
</main>

<script>
const form = document.getElementById("search-form");
const input = document.getElementById("search-input");
const btn = document.getElementById("search-btn");
const results = document.getElementById("results");

const LEVEL_LABEL = {1: "Direct evidence", 2: "Historical record", 3: "Contemporary account", 4: "AI inference"};

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

function renderSources(sources) {
  if (!sources || !sources.length) return "";
  return `<div class="source-links">${sources
    .map(s => `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.title)} ↗</a>`)
    .join("")}</div>`;
}

const SERIES_VARS = [
  "--series-1", "--series-2", "--series-3", "--series-4",
  "--series-5", "--series-6", "--series-7", "--series-8",
];

function renderTrajectoryChart(trajectories) {
  const stageLabels = trajectories[0].points.map(pt => pt.date_range);
  const n = stageLabels.length;
  if (n < 2) return "<p class=\"note\">Not enough stages yet to show a trend.</p>";

  const W = 640, H = 220;
  const mLeft = 26, mRight = 12, mTop = 12, mBottom = 26;
  const plotW = W - mLeft - mRight;
  const plotH = H - mTop - mBottom;
  const xFor = i => mLeft + (plotW * i) / (n - 1);
  const yFor = score => mTop + plotH - (score / 10) * plotH;

  const gridSvg = [0, 2, 4, 6, 8, 10].map(t => {
    const y = yFor(t);
    return `<line class="traj-gridline" x1="${mLeft}" y1="${y}" x2="${W - mRight}" y2="${y}" />
            <text class="traj-axis-label" x="${mLeft - 6}" y="${y + 3}" text-anchor="end">${t}</text>`;
  }).join("");

  const xLabelsSvg = stageLabels.map((label, i) =>
    `<text class="traj-axis-label" x="${xFor(i)}" y="${H - 6}" text-anchor="middle">${escapeHtml(label)}</text>`
  ).join("");

  const linesSvg = trajectories.map((traj, si) => {
    const color = `var(${SERIES_VARS[si % SERIES_VARS.length]})`;
    const pts = traj.points.map((pt, i) => `${xFor(i)},${yFor(pt.score)}`).join(" ");
    const lastPt = traj.points[traj.points.length - 1];
    return `<polyline class="traj-line" points="${pts}" style="stroke:${color}" />
            <circle class="traj-dot" cx="${xFor(n - 1)}" cy="${yFor(lastPt.score)}" r="4" style="fill:${color}" />`;
  }).join("");

  const segW = plotW / n;
  const hitSvg = stageLabels.map((_, i) =>
    `<rect class="traj-hit" data-index="${i}" x="${mLeft + segW * i}" y="${mTop}" width="${segW}" height="${plotH}" />`
  ).join("");

  const legendSvg = trajectories.map((traj, si) => `
    <div class="traj-legend-item">
      <span class="traj-legend-key" style="background:var(${SERIES_VARS[si % SERIES_VARS.length]})"></span>
      <span>${escapeHtml(traj.dimension)}</span>
    </div>`).join("");

  const tableRows = trajectories.map(traj => `
    <tr>
      <td>${escapeHtml(traj.dimension)}</td>
      ${traj.points.map(pt => {
        const lvl = LEVEL_LABEL[pt.evidence.evidence_level] || "Unknown";
        const hoverText = `[${lvl}] ${pt.evidence.claim}${pt.evidence.uncertainty_note ? " — " + pt.evidence.uncertainty_note : ""}`;
        return `<td title="${escapeHtml(hoverText)}">${pt.score}/10</td>`;
      }).join("")}
    </tr>`).join("");

  const allSources = [];
  const seenUrls = new Set();
  trajectories.forEach(traj => traj.points.forEach(pt => (pt.evidence.sources || []).forEach(s => {
    if (!seenUrls.has(s.url)) { seenUrls.add(s.url); allSources.push(s); }
  })));

  return `
    <div class="traj-wrap">
      <svg class="traj-svg" viewBox="0 0 ${W} ${H}" id="traj-svg-el">
        ${gridSvg}
        ${xLabelsSvg}
        ${linesSvg}
        <line class="traj-crosshair" id="traj-crosshair-el" x1="${xFor(0)}" y1="${mTop}" x2="${xFor(0)}" y2="${mTop + plotH}" />
        ${hitSvg}
      </svg>
      <div class="traj-tooltip" id="traj-tooltip-el"></div>
      <div class="traj-legend">${legendSvg}</div>
      <button class="traj-table-toggle" id="traj-table-toggle-el" type="button">View as table</button>
      <table class="traj-table" id="traj-table-el">
        <thead><tr><th>Pattern</th>${stageLabels.map(l => `<th>${escapeHtml(l)}</th>`).join("")}</tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
      <p class="note" style="margin-top:0.5rem">
        Every score is the AI's inference from the decisions in Stage by Stage below, not a measurement — hover a chart point or table cell for the specific claim it rests on.
        ${allSources.length ? renderSources(allSources) : ""}
      </p>
    </div>`;
}

function attachTrajectoryInteractivity(trajectories) {
  const svg = document.getElementById("traj-svg-el");
  if (!svg) return;
  const crosshair = document.getElementById("traj-crosshair-el");
  const tooltip = document.getElementById("traj-tooltip-el");
  const tableToggle = document.getElementById("traj-table-toggle-el");
  const table = document.getElementById("traj-table-el");
  const hits = svg.querySelectorAll(".traj-hit");

  function showTooltip(i) {
    const hit = hits[i];
    const x = parseFloat(hit.getAttribute("x")) + parseFloat(hit.getAttribute("width")) / 2;
    crosshair.setAttribute("x1", x);
    crosshair.setAttribute("x2", x);
    crosshair.style.opacity = "1";

    const rows = trajectories.map((traj, si) => {
      const pt = traj.points[i];
      const color = `var(${SERIES_VARS[si % SERIES_VARS.length]})`;
      return `<div class="traj-tooltip-block">
        <div class="traj-tooltip-row">
          <span class="traj-tooltip-key" style="background:${color}"></span>
          <span class="traj-tooltip-score">${pt.score}/10</span>
          <span class="traj-tooltip-name">${escapeHtml(traj.dimension)}</span>
        </div>
        ${renderClaim(pt.evidence, pt.evidence.claim)}
      </div>`;
    }).join("");
    tooltip.innerHTML = `<div class="traj-tooltip-date">${escapeHtml(trajectories[0].points[i].date_range)}</div>${rows}`;
    tooltip.style.opacity = "1";

    const svgRect = svg.getBoundingClientRect();
    const scaleX = svgRect.width / 640;
    const pxX = x * scaleX;
    const wrapWidth = svg.parentElement.getBoundingClientRect().width;
    tooltip.style.left = Math.max(0, Math.min(pxX + 10, wrapWidth - 280)) + "px";
    tooltip.style.top = "4px";
  }

  function hideTooltip() {
    crosshair.style.opacity = "0";
    tooltip.style.opacity = "0";
  }

  hits.forEach((hit, i) => {
    hit.addEventListener("pointerenter", () => showTooltip(i));
    hit.addEventListener("pointermove", () => showTooltip(i));
    hit.addEventListener("pointerleave", hideTooltip);
  });

  if (tableToggle && table) {
    tableToggle.addEventListener("click", () => {
      const showing = table.style.display === "table";
      table.style.display = showing ? "none" : "table";
      tableToggle.textContent = showing ? "View as table" : "Hide table";
    });
  }
}

function renderClaim(evidence, textOverride) {
  if (!evidence) return "";
  const lvl = evidence.evidence_level;
  return `
    <div class="claim">
      <p><span class="badge lvl-${lvl}">${LEVEL_LABEL[lvl] || "Unknown"}</span>${escapeHtml(textOverride ?? evidence.claim)}</p>
      ${evidence.uncertainty_note ? `<p class="note">${escapeHtml(evidence.uncertainty_note)}</p>` : ""}
      ${renderSources(evidence.sources)}
    </div>`;
}

function renderProfile(p) {
  const parts = [];

  parts.push(`
    <div class="meta-line">
      ${p.birth ? `Born ${escapeHtml(p.birth)}` : ""}${p.death ? ` · Died ${escapeHtml(p.death)}` : ""}
      ${p.occupations && p.occupations.length ? ` · ${p.occupations.map(escapeHtml).join(", ")}` : ""}
    </div>
    <p>${escapeHtml(p.summary)}</p>
  `);

  if (p.pattern_profile && p.pattern_profile.overall_scores && p.pattern_profile.overall_scores.length) {
    const pp = p.pattern_profile;

    parts.push(`
      <section class="card">
        <h2>Thinking Pattern</h2>
        ${pp.overall_scores.map(s => `
          <div class="meter-row">
            <div class="meter-label">
              <strong>${escapeHtml(s.dimension)}</strong>
              <span class="meter-score">${s.score}/10</span>
            </div>
            <div class="meter-track"><div class="meter-fill" style="width:${s.score * 10}%"></div></div>
            <p class="meter-justification">
              <span class="badge lvl-${s.evidence.evidence_level}">${LEVEL_LABEL[s.evidence.evidence_level] || "Unknown"}</span>
              ${escapeHtml(s.justification)}
            </p>
            ${s.evidence.uncertainty_note ? `<p class="note">${escapeHtml(s.evidence.uncertainty_note)}</p>` : ""}
            ${renderSources(s.evidence.sources)}
          </div>`).join("")}
      </section>`);

    if (pp.trajectories && pp.trajectories.length) {
      parts.push(`
        <section class="card">
          <h2>Trajectory</h2>
          ${renderTrajectoryChart(pp.trajectories)}
        </section>`);
    }

    if (pp.stages && pp.stages.length) {
      parts.push(`
        <section class="card">
          <h2>Stage by Stage</h2>
          ${pp.stages.map(stage => `
            <div class="stage-card">
              <div class="stage-header">
                <strong>${escapeHtml(stage.stage_label)}</strong>
                <span class="stage-date">${escapeHtml(stage.date_range)}</span>
              </div>
              ${(stage.decisions || []).map(d => `
                <div class="decision-block">
                  <p class="decision-title">${escapeHtml(d.decision)}</p>
                  <p class="decision-situation">${escapeHtml(d.situation)}</p>
                  <div class="style-row">
                    <span class="style-label">Decided by</span>
                    <span>${escapeHtml(d.decision_making_style)}</span>
                  </div>
                  <div class="style-row">
                    <span class="style-label">Executed by</span>
                    <span>${escapeHtml(d.execution_style)}</span>
                  </div>
                  <div class="thinking-pattern-box">
                    <div class="meter-label">
                      <strong>Thinking pattern</strong>
                      <span class="meter-score">strength ${d.pattern_strength}/10</span>
                    </div>
                    <div class="meter-track" style="margin-bottom:0.5rem">
                      <div class="meter-fill" style="width:${d.pattern_strength * 10}%"></div>
                    </div>
                    ${escapeHtml(d.thinking_pattern)}
                  </div>
                  ${renderClaim(d.evidence)}
                </div>`).join("")}
            </div>`).join("")}
        </section>`);
    }
  }

  if (p.narrative && p.narrative.length) {
    parts.push(`<section class="card"><h2>Why</h2>${p.narrative.map(c => renderClaim(c)).join("")}</section>`);
  }

  if (p.environment) {
    const env = p.environment;
    const envText = [
      env.political_climate && `Political climate: ${env.political_climate}`,
      env.economic_conditions && `Economic conditions: ${env.economic_conditions}`,
      env.technology_available && `Available technology: ${env.technology_available}`,
      env.culture_and_norms && `Culture & norms: ${env.culture_and_norms}`,
    ].filter(Boolean).join(" — ");
    parts.push(`
      <section class="card">
        <h2>Environment — ${escapeHtml(env.place)}, ${escapeHtml(env.period)}</h2>
        ${renderClaim(env.evidence, envText || env.evidence.claim)}
      </section>`);
  }

  if (p.timeline && p.timeline.length) {
    parts.push(`
      <section class="card">
        <h2>Timeline</h2>
        ${p.timeline.map(ev => `
          <div class="timeline-item">
            <div class="timeline-date">${escapeHtml(ev.date_label)}</div>
            <div style="flex:1">
              <strong>${escapeHtml(ev.title)}</strong>
              ${renderClaim(ev.evidence, ev.description)}
            </div>
          </div>`).join("")}
      </section>`);
  }

  if (p.relationships && p.relationships.length) {
    parts.push(`
      <section class="card">
        <h2>Relationships</h2>
        ${p.relationships.map(r => `
          <div class="claim">
            <p><strong>${escapeHtml(r.name)}</strong> — ${escapeHtml(r.relation_type)}</p>
            ${renderClaim(r.evidence, r.description)}
          </div>`).join("")}
      </section>`);
  }

  results.innerHTML = `<h2 style="margin-bottom:0">${escapeHtml(p.name)}</h2>` + parts.join("");

  if (p.pattern_profile && p.pattern_profile.trajectories && p.pattern_profile.trajectories.length) {
    attachTrajectoryInteractivity(p.pattern_profile.trajectories);
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = input.value.trim();
  if (!name) return;

  btn.disabled = true;
  results.innerHTML = `<p class="status">Researching ${escapeHtml(name)}…</p>`;

  try {
    const resp = await fetch(`/api/person/${encodeURIComponent(name)}`);
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.detail || `Request failed (${resp.status})`);
    }
    const profile = await resp.json();
    renderProfile(profile);
  } catch (err) {
    results.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
