<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Human Context AI — MVP</title>
<link rel="stylesheet" href="/shared.css" />
</head>
<body>
<main>
  <nav class="topbar">
    <h1 style="margin:0">Human Context AI</h1>
    <a href="/family.html">Family Ancestor Tool →</a>
  </nav>
  <p class="tagline">Search a historical or public figure. Not "what happened" — why it happened.</p>

  <form id="search-form">
    <input id="search-input" type="text" placeholder="e.g. Nikola Tesla" autocomplete="off" />
    <button type="submit" id="search-btn">Explain</button>
  </form>

  <div id="results"></div>
</main>

<script src="/shared.js"></script>
<script>
const form = document.getElementById("search-form");
const input = document.getElementById("search-input");
const btn = document.getElementById("search-btn");
const results = document.getElementById("results");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = input.value.trim();
  if (!name) return;

  btn.disabled = true;
  results.innerHTML = `<p class="status">Researching ${escapeHtml(name)}…</p>`;

  try {
    const resp = await fetch(`/api/person/${encodeURIComponent(name)}`);
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.detail || `Request failed (${resp.status})`);
    }
    const profile = await resp.json();
    renderProfile(profile, results);
  } catch (err) {
    results.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
